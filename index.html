<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>OMR Scanner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>OMR Scanner</h1>
        
        <div class="scanner-section">
            <h2>Scan OMR Sheet</h2>
            <div class="camera-container">
                <video id="camera" autoplay playsinline muted></video>
                <div class="camera-overlay"></div>
                <button id="capture">Capture OMR Sheet</button>
                <canvas id="canvas" style="display: none;"></canvas>
            </div>
            <div class="preview">
                <h3>Captured Image</h3>
                <img id="preview" style="display: none;">
            </div>
        </div>

        <div class="omr-config-section">
            <h2>OMR Configuration</h2>
            <div class="config-form">
                <div class="form-group">
                    <label for="num-questions">Number of Questions:</label>
                    <input type="number" id="num-questions" value="100" min="1" max="200">
                </div>
                <div class="form-group">
                    <label for="options-per-question">Options per Question:</label>
                    <input type="number" id="options-per-question" value="4" min="2" max="6">
                </div>
                <div class="form-group">
                    <label>Available Options:</label>
                    <div id="options-container">
                        <label><input type="checkbox" value="A" checked> A</label>
                        <label><input type="checkbox" value="B" checked> B</label>
                        <label><input type="checkbox" value="C" checked> C</label>
                        <label><input type="checkbox" value="D" checked> D</label>
                        <label><input type="checkbox" value="E"> E</label>
                        <label><input type="checkbox" value="F"> F</label>
                    </div>
                </div>
                <button id="update-form">Update Answer Form</button>
            </div>
        </div>

        <div class="answer-key-section">
            <h2>Answer Key Input</h2>
            <div id="answer-form">
                <!-- Will be populated by JavaScript -->
            </div>
            <button id="process">Process OMR</button>
        </div>

        <div class="result-section">
            <h2>Results</h2>
            <div id="results"></div>
            <button id="email-results" style="display: none;">Email Results</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/opencv.js"></script>
    <script src="script.js"></script>
</body>
</html>
