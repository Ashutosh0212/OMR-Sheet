<!DOCTYPE html>
<html>
<head>
    <title>OMR Scanner Test</title>
    <link rel="stylesheet" href="styles.css">
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <!-- OpenCV.js -->
    <script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <!-- Image segmentation model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/deeplab"></script>
</head>
<body>
    <div class="container">
        <h1>OMR Scanner Test</h1>
        
        <div class="test-section">
            <h2>Test Image</h2>
            <input type="file" id="imageInput" accept="image/*">
            <div class="preview-container">
                <img id="preview" style="display: none; max-width: 100%;">
                <canvas id="canvas" style="display: none;"></canvas>
                <canvas id="debugCanvas" class="debug-overlay"></canvas>
            </div>
            <button id="process" disabled>Process OMR</button>
            <div id="model-status">Loading models...</div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        let isImageLoaded = false;
        let modelsLoaded = false;

        // Wait for OpenCV and TensorFlow to load
        async function waitForModels() {
            const statusDiv = document.getElementById('model-status');
            try {
                // Wait for OpenCV
                if (typeof cv === 'undefined') {
                    statusDiv.textContent = 'Loading OpenCV...';
                    await new Promise(resolve => {
                        const checkCV = setInterval(() => {
                            if (typeof cv !== 'undefined') {
                                clearInterval(checkCV);
                                resolve();
                            }
                        }, 100);
                    });
                }

                // Initialize TensorFlow backend
                statusDiv.textContent = 'Initializing TensorFlow...';
                await tf.ready();
                
                modelsLoaded = true;
                statusDiv.textContent = 'Models loaded - Ready to process';
                statusDiv.style.color = '#28a745';
            } catch (error) {
                console.error('Error loading models:', error);
                statusDiv.textContent = 'Error loading models';
                statusDiv.style.color = '#dc3545';
            }
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const processBtn = document.getElementById('process');
            const statusDiv = document.getElementById('model-status');
            
            if (!file) {
                processBtn.disabled = true;
                statusDiv.textContent = 'Please upload an image';
                statusDiv.style.color = '#dc3545';
                return;
            }

            if (!file.type.startsWith('image/')) {
                processBtn.disabled = true;
                statusDiv.textContent = 'Please upload a valid image file';
                statusDiv.style.color = '#dc3545';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const preview = document.getElementById('preview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    
                    // Set up canvas
                    const canvas = document.getElementById('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    isImageLoaded = true;
                    processBtn.disabled = !modelsLoaded;
                    if (modelsLoaded) {
                        statusDiv.textContent = 'Image loaded - Ready to process';
                        statusDiv.style.color = '#28a745';
                    }
                };
                img.onerror = function() {
                    processBtn.disabled = true;
                    statusDiv.textContent = 'Error loading image';
                    statusDiv.style.color = '#dc3545';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('process').addEventListener('click', async function() {
            if (!isImageLoaded || !modelsLoaded) {
                alert('Please wait for models to load and upload an image');
                return;
            }

            const statusDiv = document.getElementById('model-status');
            statusDiv.textContent = 'Processing...';
            
            try {
                const scanner = new OMRScanner();
                await scanner.processOMR();
                statusDiv.textContent = 'Processing complete!';
                statusDiv.style.color = '#28a745';
            } catch (error) {
                console.error('Processing error:', error);
                statusDiv.textContent = 'Error processing image: ' + error.message;
                statusDiv.style.color = '#dc3545';
            }
        });

        // Start loading models
        waitForModels();
    </script>
    <script src="script.js"></script>
</body>
</html>
